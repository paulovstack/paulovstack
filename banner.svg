  <text x="70" y="118" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="46" font-weight="700" fill="#F1F5F9">Paulo Victor</text>
  <text x="70" y="158" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="19" fill="#5EEAD4">back-end developer in training</text>
  <text x="70" y="196" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="16" fill="#8B98B8">Python  ·  C#  ·  SQL  ·  REST APIs</text>

  <line x1="70" y1="220" x2="410" y2="220" stroke="#233047" stroke-width="1"/>
  <text x="70" y="250" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#64748B">Systems Analysis &amp; Development student — Rio de Janeiro, Brazil</text>
