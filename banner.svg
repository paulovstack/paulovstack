<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#111C34"/>
    </linearGradient>
    <radialGradient id="glow" cx="82%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#5EEAD4" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#5EEAD4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#1B2740"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#dots)"/>
  <rect width="1200" height="300" fill="url(#glow)"/>

  <!-- API / backend node graph -->
  <g stroke="#2DD4BF" stroke-width="1.4" opacity="0.5">
    <line x1="840" y1="95" x2="945" y2="58"/>
    <line x1="840" y1="95" x2="935" y2="152"/>
    <line x1="935" y1="152" x2="1042" y2="118"/>
