    <line x1="1042" y1="118" x2="1128" y2="76"/>
    <line x1="995" y1="222" x2="1100" y2="232"/>
    <line x1="1042" y1="118" x2="1128" y2="170"/>
  </g>
  <g>
    <circle cx="840" cy="95" r="6.5" fill="#5EEAD4"/>
    <circle cx="945" cy="58" r="4.5" fill="#FBBF24"/>
    <circle cx="935" cy="152" r="7.5" fill="#5EEAD4"/>
    <circle cx="1042" cy="118" r="5.5" fill="#5EEAD4"/>
    <circle cx="995" cy="222" r="5" fill="#FBBF24"/>
    <circle cx="1128" cy="76" r="4.5" fill="#5EEAD4"/>
